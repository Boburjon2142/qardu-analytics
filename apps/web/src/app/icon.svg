<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-label="QarDU Analytics — transparent light theme neon glass logo">
  <title>QarDU Analytics — Light Neon Transparent SVG</title>
  <desc>Scalable transparent logo featuring a curved neon squircle frame, an ascending arrow and four glossy chart columns. All elements are vector paths and gradients.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#00dced"/><stop offset=".26" stop-color="#04a3fd"/><stop offset=".48" stop-color="#00dff2"/><stop offset=".69" stop-color="#7860ff"/><stop offset=".86" stop-color="#f128e5"/><stop offset="1" stop-color="#ea00f5"/>
    </linearGradient>
    <linearGradient id="frameHighlight" x1=".07" y1=".11" x2=".9" y2=".83">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".23" stop-color="#b9ffff"/><stop offset=".60" stop-color="#d4d1ff"/><stop offset="1" stop-color="#fff7ff"/>
    </linearGradient>
    <linearGradient id="cyanRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16eafa" stop-opacity=".48"/><stop offset=".49" stop-color="#62bafc" stop-opacity=".19"/><stop offset="1" stop-color="#8aafff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blueRibbon" x1="0" y1="0" x2="1" y2=".6">
      <stop offset="0" stop-color="#06c2ff" stop-opacity=".34"/><stop offset=".59" stop-color="#498aff" stop-opacity=".12"/><stop offset="1" stop-color="#94b6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violetRibbon" x1=".05" y1=".5" x2="1" y2="1">
      <stop offset="0" stop-color="#626bfc" stop-opacity="0"/><stop offset=".7" stop-color="#bc85ff" stop-opacity=".13"/><stop offset="1" stop-color="#f200ea" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="arrowBody" x1="0" y1=".88" x2=".97" y2=".07">
      <stop offset="0" stop-color="#f000fe"/><stop offset=".48" stop-color="#eb00d7"/><stop offset=".75" stop-color="#ff59b4"/><stop offset=".87" stop-color="#ff9d55"/><stop offset="1" stop-color="#ffe419"/>
    </linearGradient>
    <linearGradient id="arrowInset" x1=".05" y1="1" x2=".92" y2="0">
      <stop offset="0" stop-color="#a008d8"/><stop offset=".45" stop-color="#db00da"/><stop offset=".85" stop-color="#ff38a4"/><stop offset="1" stop-color="#ffb439"/>
    </linearGradient>
    <linearGradient id="arrowTop" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f95bff"/><stop offset=".45" stop-color="#f700ed"/><stop offset=".75" stop-color="#fd3fb3"/><stop offset="1" stop-color="#fff040"/>
    </linearGradient>
    <linearGradient id="barBlue" x1=".05" y1="0" x2=".86" y2="1">
      <stop offset="0" stop-color="#d9ffff"/><stop offset=".30" stop-color="#80cbff"/><stop offset=".72" stop-color="#1973f2"/><stop offset="1" stop-color="#1678f0"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0" y1="0" x2=".84" y2="1">
      <stop offset="0" stop-color="#83fff4"/><stop offset=".2" stop-color="#16e6f7"/><stop offset=".7" stop-color="#0066f1"/><stop offset="1" stop-color="#00e4f3"/>
    </linearGradient>
    <linearGradient id="barViolet" x1=".05" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efdcff"/><stop offset=".22" stop-color="#b47dfd"/><stop offset=".72" stop-color="#7017e7"/><stop offset="1" stop-color="#c31bf0"/>
    </linearGradient>
    <linearGradient id="barPink" x1="0" y1="0" x2=".82" y2="1">
      <stop offset="0" stop-color="#ffe8ff"/><stop offset=".18" stop-color="#ff87ee"/><stop offset=".62" stop-color="#e500cf"/><stop offset="1" stop-color="#ff24d5"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2=".95">
      <stop offset="0" stop-color="#fff" stop-opacity=".82"/><stop offset=".5" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeReflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".76" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="arrowGlow" x="-12%" y="-25%" width="124%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="barShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="inside"><rect x="7" y="7" width="1240" height="1240" rx="288"/></clipPath>
    <clipPath id="barOneClip"><rect x="220" y="785" width="191" height="214" rx="42"/></clipPath>
    <clipPath id="barTwoClip"><rect x="426" y="548" width="198" height="451" rx="47"/></clipPath>
    <clipPath id="barThreeClip"><rect x="640" y="690" width="187" height="309" rx="43"/></clipPath>
    <clipPath id="barFourClip"><rect x="844" y="561" width="189" height="438" rx="46"/></clipPath>
  </defs>

  <!-- Fully transparent background: no background rectangle or filled squircle. -->
  <g clip-path="url(#inside)">
    <!-- Translucent cyan upper glass sweep (not a solid background). -->
    <path d="M 10 378 C 55 114 342 20 711 11 C 464 70 227 147 92 318 C 40 383 22 443 9 481 Z" fill="url(#cyanRibbon)"/>
    <path d="M 11 682 C 110 517 308 465 557 449 C 408 496 219 574 107 723 C 53 790 24 844 11 910 Z" fill="url(#blueRibbon)"/>
    <path d="M 1247 831 C 1191 1077 883 1200 486 1247 L 1045 1247 C 1174 1154 1213 1024 1247 831 Z" fill="url(#violetRibbon)"/>
    <path d="M 21 484 C 105 246 342 105 660 37" fill="none" stroke="#adffff" stroke-width="5" opacity=".7" filter="url(#softGlow)"/>
    <path d="M 14 751 C 179 532 368 490 610 455" fill="none" stroke="#b3faff" stroke-width="4" opacity=".70" filter="url(#softGlow)"/>

    <!-- Neon swoosh arrow, matched to the original silhouette. -->
    <path d="M 96 414 L 1172 229 L 796 520 C 832 446 735 402 608 391 C 475 378 257 390 96 414 Z" fill="#fc08e2" opacity=".36" filter="url(#arrowGlow)"/>
    <path d="M 96 413 L 1172 229 L 795 521 C 823 460 771 418 667 401 C 509 372 303 397 96 413 Z" fill="url(#arrowBody)"/>
    <path d="M 98 413 C 312 364 665 307 1172 229 C 1040 318 993 369 917 420 C 1002 340 899 312 797 326 C 578 355 325 383 98 413 Z" fill="url(#arrowTop)" opacity=".95"/>
    <path d="M 98 413 C 334 386 542 359 729 363 C 867 369 943 402 795 521 C 836 435 740 404 615 395 C 472 386 265 401 98 413 Z" fill="url(#arrowInset)"/>
    <path d="M 98 413 C 362 353 776 285 1172 229" fill="none" stroke="#fff0ff" stroke-width="4.5" stroke-linecap="round" opacity=".96"/>
    <path d="M 101 413 C 337 389 578 363 744 364 C 840 365 957 399 794 521" fill="none" stroke="#ff80f4" stroke-width="2.2" opacity=".9"/>

    <!-- Soft shadows beneath each bar. -->
    <g opacity=".32" filter="url(#barShadow)">
      <rect x="222" y="991" width="192" height="20" rx="10" fill="#2975ff"/>
      <rect x="425" y="990" width="200" height="20" rx="10" fill="#00cfe8"/>
      <rect x="637" y="991" width="193" height="20" rx="10" fill="#9c26ff"/>
      <rect x="841" y="991" width="193" height="20" rx="10" fill="#ed00cb"/>
    </g>

    <!-- First, pale blue bar. -->
    <rect x="220" y="785" width="191" height="214" rx="42" fill="url(#barBlue)" stroke="#ffffff" stroke-width="5"/>
    <rect x="224" y="789" width="183" height="206" rx="39" fill="none" stroke="#64dfff" stroke-width="3"/>
    <g clip-path="url(#barOneClip)"><path d="M 219 938 L 219 833 Q 221 785 267 785 H 402 C 368 844 295 868 219 938 Z" fill="url(#glassSheen)"/></g>

    <!-- Second, cyan-blue bar. -->
    <rect x="426" y="548" width="198" height="451" rx="47" fill="url(#barCyan)" stroke="#ffffff" stroke-width="5"/>
    <rect x="430" y="552" width="190" height="443" rx="44" fill="none" stroke="#26f7ff" stroke-width="3.5"/>
    <g clip-path="url(#barTwoClip)"><path d="M 426 717 L 426 596 Q 428 548 479 548 H 623 C 607 607 499 650 426 717 Z" fill="url(#glassSheen)"/></g>

    <!-- Third violet bar. -->
    <rect x="640" y="690" width="187" height="309" rx="43" fill="url(#barViolet)" stroke="#ffffff" stroke-width="5"/>
    <rect x="644" y="694" width="179" height="301" rx="40" fill="none" stroke="#bd5cff" stroke-width="3"/>
    <g clip-path="url(#barThreeClip)"><path d="M 640 855 L 640 736 Q 640 690 690 690 H 826 C 794 741 702 781 640 855 Z" fill="url(#glassSheen)"/></g>

    <!-- Fourth magenta bar. -->
    <rect x="844" y="561" width="189" height="438" rx="46" fill="url(#barPink)" stroke="#ffffff" stroke-width="5"/>
    <rect x="848" y="565" width="181" height="430" rx="43" fill="none" stroke="#ff69ef" stroke-width="3"/>
    <g clip-path="url(#barFourClip)"><path d="M 844 734 L 844 608 Q 844 561 898 561 H 1033 C 991 628 911 663 844 734 Z" fill="url(#glassSheen)"/></g>

    <!-- Restrained reflected light below the bars: fade to transparency. -->
    <g opacity=".10" mask="url(#reflectionMask)" filter="url(#barShadow)">
      <rect x="220" y="1005" width="191" height="154" rx="37" fill="url(#barBlue)"/>
      <rect x="426" y="1005" width="198" height="154" rx="37" fill="url(#barCyan)"/>
      <rect x="640" y="1005" width="187" height="154" rx="37" fill="url(#barViolet)"/>
      <rect x="844" y="1005" width="189" height="154" rx="37" fill="url(#barPink)"/>
    </g>
  </g>
  <!-- Rounded square is only an illuminated outline; interior remains transparent. -->
  <rect x="7" y="7" width="1240" height="1240" rx="288" fill="none" stroke="url(#frame)" stroke-width="13" opacity=".5" filter="url(#softGlow)"/>
  <rect x="7" y="7" width="1240" height="1240" rx="288" fill="none" stroke="url(#frame)" stroke-width="8"/>
  <rect x="12" y="12" width="1230" height="1230" rx="282" fill="none" stroke="url(#frameHighlight)" stroke-width="2.5" opacity=".94"/>
  <defs>
    <linearGradient id="reflectionGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity=".7"/>
      <stop offset=".75" stop-color="white" stop-opacity=".02"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflectionMask" maskUnits="userSpaceOnUse" x="210" y="1000" width="835" height="165"><rect x="210" y="1000" width="835" height="165" fill="url(#reflectionGradient)"/></mask>
  </defs>
</svg>
