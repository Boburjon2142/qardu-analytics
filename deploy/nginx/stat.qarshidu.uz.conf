# QarDU Analytics — https://stat.qarshidu.uz
# Install: /etc/nginx/sites-available/stat.qarshidu.uz.conf + symlink in sites-enabled.
# The certificate must exist first (deploy/scripts/obtain-cert.sh), otherwise `nginx -t` fails.
# Requires nginx >= 1.18. Other server blocks on this host are not affected.
# IPv4 only, like the other sites on the current host (it sits behind NAT without public IPv6).
# Add `listen [::]:80;` / `listen [::]:443 ssl http2;` if the host gets public IPv6.

# Login brute-force brake in front of Django's own throttle (names are global: keep the prefix).
limit_req_zone $binary_remote_addr zone=qardu_login:10m rate=10r/m;

upstream qardu_api {
    server 127.0.0.1:8100;
    keepalive 16;
}

upstream qardu_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    server_name stat.qarshidu.uz;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name stat.qarshidu.uz;

    ssl_certificate     /etc/letsencrypt/live/stat.qarshidu.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stat.qarshidu.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:qardu_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Provisional evidence-file limit (20 MB, not yet fixed policy).
    client_max_body_size 20M;
    server_tokens off;

    # Security headers for every response (no add_header inside locations, so these are inherited).
    # HSTS starts at 1 day; raise to 31536000 once HTTPS has been stable for a few weeks.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Next.js App Router emits inline bootstrap scripts, hence 'unsafe-inline' for scripts/styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # The dashboard still shows mock data: keep it out of search engines until real data exists.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Optional pilot gate (decision pending): uncomment to require a password for the whole site.
    # auth_basic "QarDU Analytics (pilot)";
    # auth_basic_user_file /etc/nginx/qardu.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (never append) so clients cannot spoof their address or scheme.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /api/v1/auth/login/ {
        limit_req zone=qardu_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://qardu_api;
    }

    location /api/ {
        proxy_read_timeout 60s;
        proxy_pass http://qardu_api;
    }

    location / {
        proxy_pass http://qardu_web;
    }
}
