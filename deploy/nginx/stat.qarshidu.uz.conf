# QarDU Analytics — https://stat.qarshidu.uz
#
# Topology (verified 2026-11-26): the university's Kerio Control reverse proxy on 213.230.96.104
# terminates TLS with its *.qarshidu.uz certificate and forwards plain HTTP to this host
# (192.168.240.119:80), exactly like alumni.qarshidu.uz and sdg.qarshidu.uz. So this site has
# NO certificate of its own and must not redirect port 80 to https (that would loop).
#
# Install:  install -m 644 deploy/nginx/stat.qarshidu.uz.conf /etc/nginx/sites-available/
#           ln -sfn /etc/nginx/sites-available/stat.qarshidu.uz.conf /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
# Requires nginx >= 1.18 with the realip module (standard in Ubuntu packages).

# Login brute-force brake in front of Django's own throttle (names are global: keep the prefix).
limit_req_zone $binary_remote_addr zone=qardu_login:10m rate=10r/m;

# Scheme the *client* used at Kerio. Kerio is configured to serve this host over HTTPS; if it
# ever forwards a plain-HTTP request and says so, send the browser to https.
map $http_x_forwarded_proto $qardu_client_proto {
    default "https";
    "http"  "http";
}

upstream qardu_api {
    server 127.0.0.1:8100;
    keepalive 16;
}

upstream qardu_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    server_name stat.qarshidu.uz;

    # Trust X-Forwarded-For only from the Kerio proxy, so clients cannot spoof their address.
    set_real_ip_from 192.168.240.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    if ($qardu_client_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Provisional evidence-file limit (20 MB, not yet fixed policy).
    client_max_body_size 20M;
    server_tokens off;

    # Security headers for every response (no add_header inside locations, so these are inherited).
    # HSTS starts at 1 day; raise to 31536000 once HTTPS has been stable for a few weeks.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Next.js App Router emits inline bootstrap scripts, hence 'unsafe-inline' for scripts/styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # The dashboard still shows sample data: keep it out of search engines until real data exists.
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # $remote_addr is the real client here (realip above). Overwrite, never append.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Clients always reach Kerio over HTTPS (see the map/redirect above).
    proxy_set_header X-Forwarded-Proto https;

    location = /api/v1/auth/login/ {
        limit_req zone=qardu_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://qardu_api;
    }

    location /api/ {
        proxy_read_timeout 60s;
        proxy_pass http://qardu_api;
    }

    location / {
        proxy_pass http://qardu_web;
    }
}
